name: GitHub Pages

on:
  push:
    branches: [gh-pages]
    paths:
      - 'site/**'
      - 'tools/build_pages.py'
      - 'tools/check_pages_browser.py'
      - 'site/browser-requirements.txt'
      - 'docs/images/**'
      - 'design/icon/katadroid-ai-512.png'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'site/**'
      - 'tools/build_pages.py'
      - 'tools/check_pages_browser.py'
      - 'site/browser-requirements.txt'
      - 'docs/images/**'
      - 'design/icon/katadroid-ai-512.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site sources
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and validate static site
        run: python3 tools/build_pages.py
      - name: Install browser checks
        run: |
          python -m pip install -r site/browser-requirements.txt
          python -m playwright install --with-deps --no-shell chromium
      - name: Check site interactions and layouts
        run: python tools/check_pages_browser.py
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .local/pages-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
